name: CI and publish Docker image

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOVCS: '*:off'
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race -timeout 10m ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null .

  image:
    name: Build and optionally publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Select image tag
        if: env.PUBLISH == 'true'
        id: tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tag=latest
          else
            tag=$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C sed 's/[^a-zA-Z0-9_.-]/_/g; s/^[.-]/_/')
            tag=${tag:0:128}
          fi
          printf 'value=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.PUBLISH == 'true' && format('{0}/{1}:{2}', secrets.DOCKER_USERNAME, github.event.repository.name, steps.tag.outputs.value) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
